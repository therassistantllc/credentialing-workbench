name: Unpack Phase 1

on:
  push:
    branches:
      - feat/credentialing-workbench-phase1

permissions:
  contents: write

jobs:
  unpack:
    if: github.event.head_commit.message != 'chore: unpack credentialing workbench phase1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/credentialing-workbench-phase1
          fetch-depth: 0
      - name: Rehydrate Phase 1 source
        shell: bash
        run: |
          set -euo pipefail
          cat .phase1/part{00..07}.b64 > /tmp/phase1.b64
          base64 --decode /tmp/phase1.b64 > /tmp/phase1-truncated.zip
          zip -FF /tmp/phase1-truncated.zip --out /tmp/phase1.zip
          unzip -t /tmp/phase1.zip
          unzip -o /tmp/phase1.zip -d .
          rm -rf .phase1
          rm -f .github/workflows/unpack-phase1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: unpack credentialing workbench phase1'
          git push origin HEAD:feat/credentialing-workbench-phase1
